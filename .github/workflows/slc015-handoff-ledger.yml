name: SLC-015 handoff ledger

on:
  push:
    branches:
      - codex/sab80535-timer2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sab80535-timer2
          fetch-depth: 0
      - name: Record cross-repo handoffs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          product='e388a007635acb4f964326f817a3d6eb049ccf6d'
          p26='https://github.com/Hans-Einar/ponsse/issues/26#issuecomment-5517911661'
          p47='https://github.com/Hans-Einar/ponsse/issues/47#issuecomment-5517915220'
          p=Path('SDP/Sprints/SPR-009--sab80535-timer2/Handoff.md')
          t=p.read_text()
          if '## Cross-repository handoffs' not in t:
              t += f'''\n## Cross-repository handoffs\n\n- Ponsse Issue #26 exact CPU convergence handoff: {p26}\n- Ponsse Issue #47 peripheral-simulator dependency handoff: {p47}\n\nBoth consumers are instructed to pin exact accepted CPU product HEAD\n`{product}` rather than the moving PR/SDP head.\n'''
          p.write_text(t)

          p=Path('SDP/Traceability/Ledger.ndjson')
          t=p.read_text().rstrip()+"\n"
          if '"EVT-2026-09-03-180"' not in t:
              t += '{"event_id":"EVT-2026-09-03-180","timestamp":"2026-09-03T01:30:00+02:00","type":"cross_repository_handoff","subject_id":"SLC-015","status":"accepted","repository":"Hans-Einar/ponsse","issue":26,"url":"'+p26+'","product_head":"'+product+'","source":"SDP/Sprints/SPR-009--sab80535-timer2/Handoff.md"}\n'
              t += '{"event_id":"EVT-2026-09-03-181","timestamp":"2026-09-03T01:30:01+02:00","type":"cross_repository_handoff","subject_id":"SLC-015","status":"accepted","repository":"Hans-Einar/ponsse","issue":47,"url":"'+p47+'","product_head":"'+product+'","source":"SDP/Sprints/SPR-009--sab80535-timer2/Handoff.md"}\n'
          p.write_text(t)
          PY
          git diff --check
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:core.c)" = "$(git hash-object core.c)"
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:emu8051.h)" = "$(git hash-object emu8051.h)"
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:tests/Makefile)" = "$(git hash-object tests/Makefile)"
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:tests/test_stage4_timer2.c)" = "$(git hash-object tests/test_stage4_timer2.c)"
          git rm .github/workflows/slc015-handoff-ledger.yml
          git config user.name 'SLC-015 Master'
          git config user.email '36501395+Hans-Einar@users.noreply.github.com'
          git add SDP
          git commit -m 'SDP: record SLC-015 Ponsse handoffs'
          git push origin HEAD:codex/sab80535-timer2
