name: SLC-015 SDP finalize

on:
  push:
    branches:
      - codex/sab80535-timer2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sab80535-timer2
          fetch-depth: 0
      - name: Finalize SLC-015 SDP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          PRODUCT='e388a007635acb4f964326f817a3d6eb049ccf6d'
          TREE='8eb677ad298a3a743adb9d51f464b90ba755b0cf'
          BASE='bc86d2633b6057529e6fd1e666896c24d72822aa'
          DAP='36639b48ddb2ffbafa14c00da794fe1734f7483b'

          def replace_once(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t:
                  if new in t: return
                  raise SystemExit(f'missing anchor in {path}: {old[:80]!r}')
              p.write_text(t.replace(old,new,1))

          # Design becomes current after independent review + Master verification.
          replace_once('SDP/05--Design/EMU-SAB80535-DES-009.md',
                       'Status: active target design','Status: active current design')

          # Sprint closure.
          p=Path('SDP/Sprints/SPR-009--sab80535-timer2/sprint.md'); t=p.read_text()
          t=t.replace('Status: active','Status: complete',1)
          if '## Verified result' not in t:
              t += f'''\n## Verified result\n\nREV-SLC-015 independently approved exact product/test HEAD\n`{PRODUCT}` / tree `{TREE}` with no findings.\nVER-SLC-015 passed exact-head Linux GCC/strict-Clang/ASan+UBSan/debug/DAP and\nWindows GCC/strict-Clang verification. SLC-015 is accepted and satisfies\nREQ-014 within the explicitly reached Timer2 mode boundary.\n\nPR #18 remains open and intentionally unmerged pending Steering authorization.\nSPR-009 is complete; no Stage-5 work is authorized by this closure.\n'''
          p.write_text(t)

          # Iteration closure + immutable result chain.
          p=Path('SDP/Sprints/SPR-009--sab80535-timer2/ScrumIterations.md'); t=p.read_text()
          t=t.replace('Status: active\nIteration ID: ITR-015','Status: complete\nIteration ID: ITR-015',1)
          if '### Worker result' not in t:
              t += f'''\n### Worker result\n\nThe bounded Worker product/test result is exact HEAD `{PRODUCT}` / tree\n`{TREE}`. Worker Actions run `33688691147`, job `100442147454`, passed the\nfull GCC/strict-Clang/ASan+UBSan core matrix, frozen debug runtime, frozen DAP\nexact-head integration and scope audit before publishing that product commit.\n\n### Review result\n\nFresh independent REV-SLC-015 approved exact HEAD `{PRODUCT}` with no findings.\nThe Reviewer independently reconciled Siemens T2CON/input/prescaler/reload/TF2\nsemantics, challenged the free-running `/24` phase, ran separate phase/interrupt\nprobes and repeated core/debug/DAP regressions.\n\n### Final result\n\nAccepted. VER-SLC-015 passed Master verification against the same exact product\nidentity. Corrected Master Actions run `33694685888` passed Linux exact-head\nidentity/GCC/Clang/ASan+UBSan/debug/DAP/scope gates and Windows GCC + strict\nClang core gates. The first Windows attempt in run `33694518622` failed only\nbecause MSYS2 minimal PATH could not find a redundant `git` command before any\ncompile; the harness was corrected without changing product/test HEAD.\n\nSLC-015 satisfies REQ-014. No corrective Slice is required and no later CPU\nscope is activated.\n'''
          p.write_text(t)

          # Implementation notes accepted state.
          p=Path('SDP/Sprints/SPR-009--sab80535-timer2/implementationNotes.md'); t=p.read_text()
          t=t.replace('Status: Worker complete; fresh independent review required.',
                      'Status: verified; SLC-015 accepted.',1)
          if '## Accepted review' not in t:
              t += f'''\n## Accepted review\n\nREV-SLC-015 independently approved exact `{PRODUCT}` / `{TREE}` with no\nfindings. The independent issue checkpoint is\nhttps://github.com/Hans-Einar/emuSA80535-N/issues/17#issuecomment-5517618869.\n\n## Master verification\n\nVER-SLC-015 passed against exact `{PRODUCT}`. Master run `33694685888` passed\nLinux GCC/strict Clang/ASan+UBSan/frozen debug/frozen DAP/scope gates and\nWindows GCC + strict Clang core matrices. The earlier Windows harness-only\nfailure in run `33694518622` attempted no compilation and was corrected without\nchanging product/test state.\n\nREQ-014 is satisfied/current. No external/gated input, hardware reload, EXF2,\ncapture/compare, automatic P5.4, target/live I/O or debug-protocol scope was\nadded.\n'''
          p.write_text(t)

          # Handoff now points only to Steering merge gate.
          Path('SDP/Sprints/SPR-009--sab80535-timer2/Handoff.md').write_text(f'''# Handoff\n\n## Current Objective\n\nSLC-015 is independently reviewed and Master-verified. The only remaining\nStage-4 action is Steering review of PR #18 and an explicit merge decision.\nNo new CPU Slice is active or authorized.\n\n## Authoritative Source Documents\n\n- repository `AGENTS.md` and lifecycle SDP;\n- Issue #17;\n- `SDP/05--Design/EMU-SAB80535-DES-009.md`;\n- `SDP/CodeReview/REV-SLC-015.md`;\n- `SDP/Verification/VER-SLC-015.md`;\n- Siemens SAB80515/SAB80C515 User's Manual Edition 08.95;\n- Ponsse PR #25 HEAD `19ef6ff45efa719612b70e70b8c31b9cb2ebb7e9` as consumer evidence only.\n\n## Accepted Identity\n\n- Frozen master baseline: `{BASE}`.\n- Exact accepted product/test HEAD: `{PRODUCT}`.\n- Exact accepted product tree: `{TREE}`.\n- Frozen DAP integration HEAD: `{DAP}`.\n- Implementation PR: #18, open and intentionally unmerged.\n\nCommits after `{PRODUCT[:8]}...` are temporary CI cleanup and SDP/review/verification\nevidence only. Product/test blobs must remain identical through the final PR\nhead; Steering must re-check this before merge.\n\n## Acceptance Evidence\n\n- REV-SLC-015: APPROVED, no findings.\n- VER-SLC-015: PASSED.\n- Worker run `33688691147`: GCC, strict Clang, ASan+UBSan, debug, DAP, scope.\n- Master run `33694685888`: Linux exact-head full gate + Windows GCC/Clang.\n- Exact `0x5555 -> 43691` case, sticky repeated TF2, controller/vector `002B`,\n  live writes, stop/reload/restart, free-running `/24`, classic isolation and\n  no automatic P5.4 all verified.\n\n## Stop Boundary\n\nDo not add external/gated Timer2 inputs, hardware reload modes, EXF2 producer,\ncompare/capture, automatic P5.4 coupling, target/board semantics, physical/live\nI/O, `emu-debug` changes or REQ-015 work without a new Steering authorization.\n\n## Traceability IDs\n\nMND-001, STU-001, REQ-014, ARCH-002..ARCH-006, DES-086..DES-095, SPR-009,\nITR-015, SLC-015, REV-SLC-015 and VER-SLC-015 are current/accepted.\n''')

          # CurrentIndex closure.
          p=Path('SDP/Traceability/CurrentIndex.yaml'); t=p.read_text()
          t=t.replace('updated: 2026-09-02','updated: 2026-09-03',1)
          t=t.replace('active:\n  sprint: SPR-009\n  iteration: ITR-015\n  slice: SLC-015',
                      'active:\n  sprint: null\n  iteration: null\n  slice: null',1)
          t=t.replace('REQ-014: {kind: requirement, status: active, state: target,',
                      'REQ-014: {kind: requirement, status: satisfied, state: current,',1)
          t=t.replace('DES-086..DES-095: {kind: design-range, status: active, state: target,',
                      'DES-086..DES-095: {kind: design-range, status: active, state: current,',1)
          t=t.replace('SPR-009: {kind: sprint, status: active, state: target,',
                      'SPR-009: {kind: sprint, status: complete, state: current,',1)
          t=t.replace('ITR-015: {kind: iteration, status: active, state: target,',
                      'ITR-015: {kind: iteration, status: complete, state: current,',1)
          t=t.replace('SLC-015: {kind: slice, status: active, state: target,',
                      'SLC-015: {kind: slice, status: accepted, state: current,',1)
          t=t.replace('REV-SLC-015: {kind: review, status: planned, state: target,',
                      'REV-SLC-015: {kind: review, status: approved, state: current,',1)
          t=t.replace('VER-SLC-015: {kind: verification, status: planned, state: target,',
                      'VER-SLC-015: {kind: verification, status: passed, state: current,',1)
          p.write_text(t)

          # Relations: append only if not already present.
          p=Path('SDP/Traceability/Relations.yaml'); t=p.read_text()
          if 'from: SPR-009, type: schedules, to: REQ-014' not in t:
              t=t.replace('updated: 2026-09-01','updated: 2026-09-03',1)
              t += '''\n  - {from: DES-086..DES-095, type: refines, to: ARCH-002..ARCH-006}\n  - {from: SPR-009, type: schedules, to: REQ-014}\n  - {from: SLC-015, type: belongs_to, to: ITR-015}\n  - {from: ITR-015, type: belongs_to, to: SPR-009}\n  - {from: SLC-015, type: satisfies, to: REQ-014}\n  - {from: SLC-015, type: depends_on, to: SLC-014}\n  - {from: SLC-015, type: implements_design, to: DES-086..DES-095}\n  - {from: REV-SLC-015, type: reviews, to: SLC-015}\n  - {from: VER-SLC-015, type: verifies, to: SLC-015}\n'''
          p.write_text(t)

          # Ledger: reconstruct the Stage-4 chain using immutable known timestamps.
          p=Path('SDP/Traceability/Ledger.ndjson'); t=p.read_text().rstrip()+"\n"
          if '"EVT-2026-09-03-169"' not in t:
              events = [
                '{"event_id":"EVT-2026-09-03-169","timestamp":"2026-09-03T00:00:00+02:00","type":"master_baseline_revalidated","subject_id":"SPR-009","status":"planned","master_head":"'+BASE+'","consumer_evidence_head":"19ef6ff45efa719612b70e70b8c31b9cb2ebb7e9","issue":17,"source":"SDP/Sprints/SPR-009--sab80535-timer2/sprint.md"}',
                '{"event_id":"EVT-2026-09-03-170","timestamp":"2026-09-03T00:00:01+02:00","type":"sprint_started","subject_id":"SPR-009","status":"active","schedules":["REQ-014"],"source":"SDP/Sprints/SPR-009--sab80535-timer2/sprint.md"}',
                '{"event_id":"EVT-2026-09-03-171","timestamp":"2026-09-03T00:00:02+02:00","type":"iteration_started","subject_id":"ITR-015","sprint_id":"SPR-009","status":"active","source":"SDP/Sprints/SPR-009--sab80535-timer2/ScrumIterations.md"}',
                '{"event_id":"EVT-2026-09-03-172","timestamp":"2026-09-03T00:00:03+02:00","type":"slice_started","subject_id":"SLC-015","sprint_id":"SPR-009","iteration_id":"ITR-015","status":"active","satisfies":["REQ-014"],"depends_on":["SLC-014"],"source":"SDP/Sprints/SPR-009--sab80535-timer2/ScrumIterations.md"}',
                '{"event_id":"EVT-2026-09-03-173","timestamp":"2026-09-03T00:08:03+02:00","type":"implementation_completed","subject_id":"SLC-015","status":"review_pending","head":"'+PRODUCT+'","tree":"'+TREE+'","base":"51f192f5b9b4bb060cff60d87bf7d6d7054861c5","changed_files":["core.c","emu8051.h","tests/Makefile","tests/test_stage4_timer2.c"],"source":"SDP/Sprints/SPR-009--sab80535-timer2/implementationNotes.md"}',
                '{"event_id":"EVT-2026-09-03-174","timestamp":"2026-09-03T00:11:24+02:00","type":"pull_request_opened","subject_id":"SPR-009","status":"open","repository":"Hans-Einar/emuSA80535-N","pull_request":18,"url":"https://github.com/Hans-Einar/emuSA80535-N/pull/18","base":"master","base_head":"'+BASE+'","head":"codex/sab80535-timer2","product_head":"'+PRODUCT+'","source":"SDP/Sprints/SPR-009--sab80535-timer2/Handoff.md"}',
                '{"event_id":"EVT-2026-09-03-175","timestamp":"2026-09-03T01:01:57+02:00","type":"review_completed","subject_id":"SLC-015","review_id":"REV-SLC-015","status":"approved","reviewed_head":"'+PRODUCT+'","reviewed_tree":"'+TREE+'","finding_ids":[],"url":"https://github.com/Hans-Einar/emuSA80535-N/issues/17#issuecomment-5517618869","source":"SDP/CodeReview/REV-SLC-015.md"}',
                '{"event_id":"EVT-2026-09-03-176","timestamp":"2026-09-03T01:22:00+02:00","type":"verification_completed","subject_id":"SLC-015","verification_id":"VER-SLC-015","status":"passed","product_head":"'+PRODUCT+'","product_tree":"'+TREE+'","dap_head":"'+DAP+'","evidence":["linux_exact_head_gcc_clang_asan_ubsan_debug_dap_scope","windows_gcc_clang_exact_head","review_identity_post_review_nonproduct_audit"],"source":"SDP/Verification/VER-SLC-015.md"}',
                '{"event_id":"EVT-2026-09-03-177","timestamp":"2026-09-03T01:22:01+02:00","type":"slice_accepted","subject_id":"SLC-015","review_id":"REV-SLC-015","verification_id":"VER-SLC-015","status":"accepted","satisfies":"REQ-014","source":"SDP/Sprints/SPR-009--sab80535-timer2/ScrumIterations.md"}',
                '{"event_id":"EVT-2026-09-03-178","timestamp":"2026-09-03T01:22:02+02:00","type":"iteration_completed","subject_id":"ITR-015","sprint_id":"SPR-009","status":"complete","source":"SDP/Sprints/SPR-009--sab80535-timer2/ScrumIterations.md"}',
                '{"event_id":"EVT-2026-09-03-179","timestamp":"2026-09-03T01:22:03+02:00","type":"sprint_completed","subject_id":"SPR-009","status":"complete","pull_request":18,"product_head":"'+PRODUCT+'","source":"SDP/Sprints/SPR-009--sab80535-timer2/sprint.md"}',
              ]
              t += "\n".join(events)+"\n"
          p.write_text(t)
          PY

          git diff --check
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:core.c)" = "$(git hash-object core.c)"
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:emu8051.h)" = "$(git hash-object emu8051.h)"
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:tests/Makefile)" = "$(git hash-object tests/Makefile)"
          test "$(git rev-parse e388a007635acb4f964326f817a3d6eb049ccf6d:tests/test_stage4_timer2.c)" = "$(git hash-object tests/test_stage4_timer2.c)"
          git rm .github/workflows/slc015-finalize.yml
          git config user.name 'SLC-015 Master'
          git config user.email '36501395+Hans-Einar@users.noreply.github.com'
          git add SDP
          git diff --cached --check
          git commit -m 'SDP: accept and close SLC-015 Timer2'
          git push origin HEAD:codex/sab80535-timer2
